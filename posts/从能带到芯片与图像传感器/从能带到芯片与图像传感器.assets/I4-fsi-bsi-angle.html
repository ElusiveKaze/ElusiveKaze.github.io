<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>前照式与背照式：斜射光能不能进本像素</title><link rel="stylesheet" href="lib/ui.css"></head>
<body><div class="wrap">
<div class="fig" style="flex-grow:370"><svg id="s" viewBox="0 0 760 370"></svg></div>
<div class="row"><label for="a">入射角（偏离竖直）</label><input id="a" type="range" min="0" max="35" step="1" value="20"><span class="val" id="av"></span></div>
<div class="cards">
<div class="card"><div class="k">前照式：进入本像素光电二极管</div><div class="v" id="f1">—</div></div>
<div class="card"><div class="k">前照式：落进隔壁像素（串扰）</div><div class="v" id="f2">—</div></div>
<div class="card"><div class="k">背照式：进入本像素光电二极管</div><div class="v" id="b1">—</div></div>
</div>
<div class="hint">示意模型：像素间距 1.4 µm，前照式布线层高 3.5 µm（折射率 1.46），背照式硅层 3 µm（折射率约 4）。只追踪中间像素的 9 条光线。</div>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg', S = document.getElementById('s');
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); (p || S).appendChild(e); return e; };
const tx = (x, y, s, a) => { const e = el('text', Object.assign({ x, y, 'font-size': 12, fill: '#5F5E5A', 'dominant-baseline': 'central' }, a || {})); e.textContent = s; return e; };
const P = 84, CFA = ['#E0533D', '#4CB050', '#5B7BE6'];
function lenses(ox) {
  for (let i = 0; i < 3; i++) {
    const a = ox + i * P;
    el('path', { d: `M${a + 3} 62 Q${a + P / 2} 34 ${a + P - 3} 62`, fill: '#EEF3F8', stroke: '#888780', 'stroke-width': 1 });
    el('rect', { x: a + 2, y: 62, width: P - 4, height: 12, fill: CFA[i], opacity: 0.75 });
  }
}
// FSI panel
const FX = 30, FSI_PD = 284;
tx(FX + 126, 14, '前照式（FSI）', { 'text-anchor': 'middle', fill: '#2C2C2A', 'font-size': 14, 'font-weight': 600 });
lenses(FX);
el('rect', { x: FX, y: 74, width: 3 * P, height: FSI_PD - 74, fill: '#F7F6F2' });
const bars = [];
[[100, 30], [150, 34], [200, 38], [250, 42]].forEach(([y, w]) => {
  for (let j = 0; j <= 3; j++) { const x = FX + j * P - w / 2; bars.push({ x0: x, x1: x + w, y0: y, y1: y + 12 }); el('rect', { x, y, width: w, height: 12, fill: '#B4B2A9', stroke: '#888780', 'stroke-width': 0.8 }); }
});
el('rect', { x: FX, y: FSI_PD, width: 3 * P, height: 60, fill: '#FAECE7', stroke: '#888780', 'stroke-width': 0.8 });
for (let i = 0; i < 3; i++) el('rect', { x: FX + i * P + 12, y: FSI_PD + 2, width: P - 24, height: 30, rx: 4, fill: '#B5D4F4', stroke: '#378ADD' });
tx(FX + 3 * P + 6, 180, '金属布线层', {}); tx(FX + 3 * P + 6, 196, '3.5 µm 高', {});
tx(FX + 3 * P + 6, FSI_PD + 17, '光电二极管', {});
// BSI panel
const BX = 420, SI0 = 80, SI1 = 260, FOCUS = 140;
tx(BX + 126, 14, '背照式（BSI）', { 'text-anchor': 'middle', fill: '#2C2C2A', 'font-size': 14, 'font-weight': 600 });
lenses(BX);
el('rect', { x: BX, y: 74, width: 3 * P, height: 6, fill: '#FAEEDA' });
el('rect', { x: BX, y: SI0, width: 3 * P, height: SI1 - SI0, fill: '#FAECE7', stroke: '#888780', 'stroke-width': 0.8 });
for (let i = 0; i < 3; i++) el('rect', { x: BX + i * P + 6, y: SI0 + 4, width: P - 12, height: SI1 - SI0 - 8, rx: 4, fill: '#B5D4F4', stroke: '#378ADD', opacity: 0.8 });
for (let j = 1; j < 3; j++) el('rect', { x: BX + j * P - 2, y: SI0, width: 4, height: SI1 - SI0 - 30, fill: '#5F5E5A' });
el('rect', { x: BX, y: SI1, width: 3 * P, height: 70, fill: '#F7F6F2' });
for (let j = 0; j <= 3; j++) [272, 300].forEach(y => el('rect', { x: BX + j * P - 18, y, width: 36, height: 10, fill: '#B4B2A9', stroke: '#888780', 'stroke-width': 0.8 }));
tx(BX + 3 * P + 6, 150, '硅 3 µm', {}); tx(BX + 3 * P + 6, 166, '光电二极管', {}); tx(BX + 3 * P + 6, 182, '占满整层', {});
tx(BX + 3 * P + 6, 220, '深沟槽隔离', {}); tx(BX + 3 * P + 6, 292, '布线在下面', {});
const rays = el('g', {});
const aI = document.getElementById('a');
function upd() {
  rays.innerHTML = '';
  const th = +aI.value * Math.PI / 180, td = Math.asin(Math.sin(th) / 1.46), ts = Math.asin(Math.sin(th) / 4);
  const N = 9; let fg = 0, fx = 0, bg = 0;
  for (let k = 0; k < N; k++) {
    const u = -34 + 68 * k / (N - 1);
    // FSI
    { const cx = FX + 1.5 * P, lx = cx + u, F = cx + (FSI_PD - 62) * Math.tan(td);
      const sx = lx - (62 - 22) * Math.tan(th);
      let endX = F, endY = FSI_PD, col = '#3B6D11', blocked = false;
      const xAt = y => lx + (F - lx) * (y - 62) / (FSI_PD - 62);
      for (const b of bars) { for (const y of [b.y0, b.y1]) { const x = xAt(y); if (x >= b.x0 && x <= b.x1 && (!blocked || y < endY)) { blocked = true; endX = x; endY = y; } } }
      if (blocked) col = '#A32D2D';
      else { const own = Math.abs(endX - cx) <= P / 2 - 12; const nb = !own && Math.abs(endX - cx) <= 1.5 * P; col = own ? '#3B6D11' : nb ? '#BA7517' : '#888780'; if (own) fg++; else if (nb) fx++; }
      el('path', { d: `M${sx} 22 L${lx} 56 L${endX} ${endY}`, fill: 'none', stroke: col, 'stroke-width': 1.3, opacity: 0.9 }, rays);
      if (blocked) el('text', { x: endX, y: endY - 2, 'font-size': 12, fill: '#A32D2D', 'text-anchor': 'middle' }, rays).textContent = '×';
    }
    // BSI
    { const cx = BX + 1.5 * P, lx = cx + u, F = cx + (SI0 - 62) * Math.tan(td) + (FOCUS - SI0) * Math.tan(ts);
      const sx = lx - (62 - 22) * Math.tan(th);
      const own = Math.abs(F + (lx - cx) * 0.15 - cx) <= P / 2 - 4; if (own) bg++;
      const ex = F + (F - lx) * 0.35;
      el('path', { d: `M${sx} 22 L${lx} 56 L${F} ${FOCUS} L${ex} ${FOCUS + 40}`, fill: 'none', stroke: own ? '#3B6D11' : '#BA7517', 'stroke-width': 1.3, opacity: 0.9 }, rays);
    }
  }
  document.getElementById('av').textContent = aI.value + '°';
  document.getElementById('f1').textContent = Math.round(fg / N * 100) + '%';
  document.getElementById('f2').textContent = Math.round(fx / N * 100) + '%';
  document.getElementById('b1').textContent = Math.round(bg / N * 100) + '%';
}
aI.addEventListener('input', upd); upd();
</script></body></html>
