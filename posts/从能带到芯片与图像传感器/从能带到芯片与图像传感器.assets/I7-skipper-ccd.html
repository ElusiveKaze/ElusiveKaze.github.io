<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skipper CCD：重复测量同一包电荷</title><link rel="stylesheet" href="lib/ui.css"></head>
<body><div class="wrap">
<div class="row"><label for="sk">每包电荷测量次数 N</label><input type="range" id="sk" min="0" max="100" value="0" step="1"><span class="val" id="skv">1</span></div>
<div class="fig" style="flex-grow:300"><svg viewBox="0 0 680 300">
<g id="grid"></g><path id="hp" fill="#378ADD" opacity="0.85"/>
<line x1="60" y1="260" x2="640" y2="260" stroke="#B4B2A9" stroke-width="0.8"/><g id="tk"></g>
<text x="640" y="294" text-anchor="end" font-size="12" fill="#5F5E5A">测得的电子数（e⁻）</text>
<text x="60" y="26" font-size="12" fill="#5F5E5A">像素个数（相对）</text>
</svg></div>
<div class="cards">
<div class="card"><div class="k">读出噪声 σ</div><div class="v" id="o1">—</div></div>
<div class="card"><div class="k">每个像素耗时</div><div class="v" id="o2">—</div></div>
<div class="card"><div class="k">读完 100 万像素</div><div class="v" id="o3">—</div></div>
</div>
<div class="hint">2 万个像素，每个像素里真实电子数按平均 1.3 个的泊松分布生成；单次测量噪声按 3.5 e⁻、每次测量 10 µs 估算。</div>
</div>
<script>
const XMIN=-6,XMAX=10,X0=60,X1=640,Y0=260,H=215,NS='http://www.w3.org/2000/svg';
const sx=v=>X0+(v-XMIN)/(XMAX-XMIN)*(X1-X0);
const gG=document.getElementById('grid'),tG=document.getElementById('tk');
for(let k=XMIN;k<=XMAX;k++){const x=sx(k);
 if(k>=0&&k<=6){const l=document.createElementNS(NS,'line');l.setAttribute('x1',x);l.setAttribute('x2',x);l.setAttribute('y1',40);l.setAttribute('y2',Y0);l.setAttribute('stroke','#D3D1C7');l.setAttribute('stroke-dasharray','3 3');gG.appendChild(l);}
 const t=document.createElementNS(NS,'text');t.setAttribute('font-size','12');t.setAttribute('fill','#5F5E5A');t.setAttribute('x',x);t.setAttribute('y',276);t.setAttribute('text-anchor','middle');t.textContent=k;tG.appendChild(t);}
let sd=2024;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
const M=20000,L=Math.exp(-1.3),nT=new Float64Array(M),z=new Float64Array(M);
for(let i=0;i<M;i++){let k=0,p=1;do{k++;p*=rnd();}while(p>L);nT[i]=k-1;const u1=Math.max(rnd(),1e-12),u2=rnd();z[i]=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);}
const BW=0.04,NB=Math.round((XMAX-XMIN)/BW),cnt=new Float64Array(NB);const sk=document.getElementById('sk');
function fmtT(s){if(s<60)return Math.round(s)+' 秒';if(s<3600)return (s/60).toFixed(1)+' 分钟';return (s/3600).toFixed(1)+' 小时';}
function upd(){const N=Math.max(1,Math.round(Math.pow(10,sk.value*0.036))),sig=3.5/Math.sqrt(N);cnt.fill(0);
 for(let i=0;i<M;i++){const v=nT[i]+sig*z[i],b=Math.floor((v-XMIN)/BW);if(b>=0&&b<NB)cnt[b]++;}
 let mx=0;for(let b=0;b<NB;b++)if(cnt[b]>mx)mx=cnt[b];
 let d='M'+X0+' '+Y0;for(let b=0;b<NB;b++){const xl=sx(XMIN+b*BW),xr=sx(XMIN+(b+1)*BW),y=Y0-cnt[b]/mx*H;d+='L'+xl.toFixed(1)+' '+y.toFixed(1)+'L'+xr.toFixed(1)+' '+y.toFixed(1);}
 d+='L'+X1+' '+Y0+'Z';document.getElementById('hp').setAttribute('d',d);
 document.getElementById('skv').textContent=N;document.getElementById('o1').textContent=sig.toFixed(2)+' e⁻';
 const us=N*10;document.getElementById('o2').textContent=us<1000?us+' µs':(us/1000).toFixed(1)+' ms';document.getElementById('o3').textContent=fmtT(N*10);}
sk.addEventListener('input',upd);upd();
</script></body></html>
