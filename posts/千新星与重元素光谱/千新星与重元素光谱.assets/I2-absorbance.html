<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>吸收有多深</title><link rel="stylesheet" href="lib/ui.css"></head>
<body><div class="wrap">
<div class="row"><button id="bL" class="on">沿长轴 10 mm</button><button id="bS">横穿 200 µm</button></div>
<div class="row"><label for="n">吸收粒子数密度 n</label><input id="n" type="range" min="10" max="16" step="0.1" value="15"><span class="val" id="nv"></span></div>
<div class="row"><label for="s">吸收截面 σ</label><input id="s" type="range" min="-19" max="-14" step="0.1" value="-15.1"><span class="val" id="sv"></span></div>
<div class="fig" style="flex-grow:170"><svg id="g" viewBox="0 0 760 170"></svg></div>
<div class="cards">
<div class="card"><div class="k">光学厚度 τ = nσL</div><div class="v" id="tau">—</div></div>
<div class="card"><div class="k">吸光度 A = log₁₀(I₀/I) = τ / ln 10</div><div class="v" id="aa">—</div></div>
<div class="card"><div class="k">透过比例 I/I₀</div><div class="v" id="tr">—</div></div>
</div>
<div class="hint">数值只用来演示公式。这里的 n 指处在吸收下能级上的粒子数密度，通常远小于等离子体的总密度（约 10¹⁸ cm⁻³）。噪声底 0.01 和最高 0.42 取自钇的近红外吸收实验。</div>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg', G = document.getElementById('g');
const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); G.appendChild(e); return e; };
const tx = (x, y, s, a) => { const e = el('text', Object.assign({ x, y, 'font-size': 12, fill: '#5F5E5A', 'dominant-baseline': 'central' }, a || {})); e.textContent = s; return e; };
tx(20, 24, '参考光 I₀'); el('rect', { x: 120, y: 14, width: 600, height: 20, rx: 3, fill: '#CECBF6' }); tx(726, 24, '100%');
tx(20, 60, '透射光 I'); const bar = el('rect', { x: 120, y: 50, height: 20, rx: 3, fill: '#534AB7' }); const bt = tx(0, 60, '');
// log axis from 0.001 to 3; values outside are pinned to the ends (the card still shows the exact number)
const A0 = 120, A1 = 720, AX = a => A0 + Math.log10(Math.min(Math.max(a, 1e-3), 3) / 1e-3) / Math.log10(3 / 1e-3) * (A1 - A0);
el('line', { x1: A0, y1: 120, x2: A1, y2: 120, stroke: '#888780' }); tx(20, 120, '吸光度 A（对数）');
[[0.01, '噪声底 0.01', '#888780'], [0.42, '论文最高 ≈ 0.42', '#BA7517'], [1, 'A = 1', '#A32D2D']].forEach(([a, s, c]) => { el('line', { x1: AX(a), y1: 106, x2: AX(a), y2: 134, stroke: c, 'stroke-dasharray': '3 3' }); tx(AX(a), 148, s, { 'text-anchor': 'middle', fill: c, 'font-size': 11 }); });
const mk = el('circle', { cy: 120, r: 7, fill: '#534AB7' });
let L = 1.0;
const nI = document.getElementById('n'), sI = document.getElementById('s');
const sci = v => { const e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e); return (m.toFixed(1) === '1.0' ? '' : m.toFixed(1) + '×') + '10^' + e; };
function sup(s) { return s.replace(/\^(-?\d+)/g, (m, d) => d.split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(c)] || '⁻').join('')); }
function upd() {
  const n = Math.pow(10, +nI.value), s = Math.pow(10, +sI.value), tau = n * s * L, A = tau / Math.LN10, T = Math.exp(-tau);
  bar.setAttribute('width', Math.max(1, 600 * T));
  // percentage label: outside the bar when it is short, inside (white) when the bar reaches the right edge
  const inside = T > 0.85; bt.setAttribute('x', inside ? 114 + 600 * T : 126 + 600 * T); bt.setAttribute('text-anchor', inside ? 'end' : 'start'); bt.setAttribute('fill', inside ? '#fff' : '#5F5E5A');
  bt.textContent = (T * 100 < 0.1 ? '<0.1' : (T * 100).toFixed(1)) + '%';
  mk.setAttribute('cx', AX(A)); mk.setAttribute('fill', A > 3 || A < 1e-3 ? '#A32D2D' : '#534AB7');
  document.getElementById('nv').textContent = sup(sci(n)) + ' cm⁻³';
  document.getElementById('sv').textContent = sup(sci(s)) + ' cm²';
  document.getElementById('tau').textContent = tau < 0.01 ? tau.toExponential(1) : tau.toFixed(2);
  document.getElementById('aa').textContent = A < 0.01 ? A.toExponential(1) : A.toFixed(2);
  document.getElementById('tr').textContent = (T * 100).toFixed(T < 0.01 ? 2 : 1) + '%';
}
function setL(v) { L = v; document.getElementById('bL').classList.toggle('on', v === 1); document.getElementById('bS').classList.toggle('on', v !== 1); upd(); }
document.getElementById('bL').onclick = () => setL(1.0); document.getElementById('bS').onclick = () => setL(0.02);
nI.addEventListener('input', upd); sI.addEventListener('input', upd); upd();
</script></body></html>
