<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>千新星降温与谱线展宽</title><link rel="stylesheet" href="lib/ui.css"></head>
<body><div class="wrap">
<div class="fig" style="flex-grow:230"><svg id="a" viewBox="0 0 760 230"></svg></div>
<div class="row"><label for="t">温度 T</label><input id="t" type="range" min="2000" max="8000" step="50" value="6500"><span class="val" id="tv"></span></div>
<div class="fig" style="flex-grow:190"><svg id="b" viewBox="0 0 760 190"></svg></div>
<div class="row"><label for="v">抛射物速度 v</label><input id="v" type="range" min="0.02" max="0.4" step="0.01" value="0.2"><span class="val" id="vv"></span></div>
<div class="cards">
<div class="card"><div class="k">黑体峰值波长 λ<sub>max</sub> = b/T</div><div class="v" id="pk">—</div></div>
<div class="card"><div class="k">1000 nm 谱线的半宽（非相对论）</div><div class="v" id="hw">—</div></div>
<div class="card"><div class="k">相对论多普勒的两端</div><div class="v" id="re">—</div></div>
</div>
<div class="hint">上图：虚线是 6500 K、3700 K、2300 K，实线是当前温度，每条曲线归一化到自己的峰值，只看形状和峰的位置（说明维恩位移，不是对 AT2017gfo 的拟合）。下图：假设一条静止时位于 1000 nm 的谱线，来自均匀膨胀、光学薄的球形抛射物，谱线呈抛物线；阴影是非相对论估计，红色虚线是相对论多普勒公式算出的两端。</div>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (S, t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); S.appendChild(e); return e; };
const A = document.getElementById('a'), B = document.getElementById('b');
const L0 = 200, L1 = 2500, x0 = 50, x1 = 740;
const X = l => x0 + (l - L0) / (L1 - L0) * (x1 - x0);
const hc_k = 1.4388e7; // nm*K
function planckN(T) { const pts = []; let mx = 0; for (let l = L0; l <= L1; l += 10) { const v = Math.pow(l, -5) / (Math.exp(hc_k / (l * T)) - 1); pts.push([l, v]); mx = Math.max(mx, v); } return pts.map(([l, v]) => [l, v / mx]); }
function axisA() {
  [[380, 450, '#7B68D8'], [450, 495, '#3F8FD9'], [495, 570, '#4CB050'], [570, 620, '#E8C547'], [620, 750, '#E0533D']].forEach(([a, b, c]) => el(A, 'rect', { x: X(a), y: 196, width: X(b) - X(a), height: 6, fill: c, opacity: 0.8 }));
  el(A, 'line', { x1: x0, y1: 202, x2: x1, y2: 202, stroke: '#888780' });
  for (let l = 500; l <= 2500; l += 500) { el(A, 'line', { x1: X(l), y1: 202, x2: X(l), y2: 207, stroke: '#888780' }); const t = el(A, 'text', { x: X(l), y: 220, 'font-size': 11, fill: '#5F5E5A', 'text-anchor': 'middle' }); t.textContent = l; }
  const t = el(A, 'text', { x: x1, y: 14, 'font-size': 12, fill: '#5F5E5A', 'text-anchor': 'end' }); t.textContent = '波长（nm）';
  [[6500, '#3F8FD9'], [3700, '#BA7517'], [2300, '#A32D2D']].forEach(([T, c]) => {
    const p = planckN(T); el(A, 'path', { d: 'M' + p.map(([l, v]) => X(l).toFixed(1) + ' ' + (196 - 170 * v).toFixed(1)).join(' L'), fill: 'none', stroke: c, 'stroke-width': 1.2, 'stroke-dasharray': '5 4', opacity: 0.8 });
    const lm = 2.898e6 / T; const tx = el(A, 'text', { x: X(lm), y: 20, 'font-size': 11, fill: c, 'text-anchor': 'middle' }); tx.textContent = T + ' K';
  });
}
axisA();
const cur = el(A, 'path', { fill: 'none', stroke: '#2C2C2A', 'stroke-width': 2.2 });
const pkL = el(A, 'line', { y1: 26, y2: 196, stroke: '#2C2C2A', 'stroke-dasharray': '2 3' });
// line profile panel
// 400-1600 nm: wide enough for the relativistic edges at v = 0.4c (655 and 1528 nm)
const XB = l => 50 + (l - 400) / 1200 * 690;
el(B, 'line', { x1: 50, y1: 160, x2: 740, y2: 160, stroke: '#888780' });
for (let l = 400; l <= 1600; l += 100) { el(B, 'line', { x1: XB(l), y1: 160, x2: XB(l), y2: 165, stroke: '#888780' }); const t = el(B, 'text', { x: XB(l), y: 178, 'font-size': 11, fill: '#5F5E5A', 'text-anchor': 'middle' }); t.textContent = l; }
el(B, 'line', { x1: XB(1000), y1: 20, x2: XB(1000), y2: 160, stroke: '#B4B2A9', 'stroke-dasharray': '2 3' });
const lt = el(B, 'text', { x: XB(1000) + 4, y: 18, 'font-size': 11, fill: '#5F5E5A' }); lt.textContent = '静止波长 1000 nm';
const shade = el(B, 'path', { fill: '#CECBF6', opacity: 0.6 });
const prof = el(B, 'path', { fill: 'none', stroke: '#534AB7', 'stroke-width': 2 });
const r1 = el(B, 'line', { y1: 30, y2: 160, stroke: '#E24B4A', 'stroke-width': 1.4, 'stroke-dasharray': '5 4' });
const r2 = el(B, 'line', { y1: 30, y2: 160, stroke: '#E24B4A', 'stroke-width': 1.4, 'stroke-dasharray': '5 4' });
const tI = document.getElementById('t'), vI = document.getElementById('v');
function upd() {
  const T = +tI.value, beta = +vI.value;
  const p = planckN(T); cur.setAttribute('d', 'M' + p.map(([l, v]) => X(l).toFixed(1) + ' ' + (196 - 170 * v).toFixed(1)).join(' L'));
  const lm = 2.898e6 / T; pkL.setAttribute('x1', X(lm)); pkL.setAttribute('x2', X(lm));
  document.getElementById('tv').textContent = T + ' K';
  document.getElementById('pk').textContent = Math.round(lm) + ' nm';
  const hw = 1000 * beta; let d = '', s = `M${XB(1000 - hw)} 160`;
  for (let i = 0; i <= 120; i++) { const l = 1000 - hw + 2 * hw * i / 120, y = 160 - 120 * (1 - Math.pow((l - 1000) / hw, 2)); d += (i ? 'L' : 'M') + XB(l).toFixed(1) + ' ' + y.toFixed(1); s += ` L${XB(l).toFixed(1)} ${y.toFixed(1)}`; }
  s += ` L${XB(1000 + hw)} 160 Z`; prof.setAttribute('d', d); shade.setAttribute('d', s);
  const lb = 1000 * Math.sqrt((1 - beta) / (1 + beta)), lr = 1000 * Math.sqrt((1 + beta) / (1 - beta));
  r1.setAttribute('x1', XB(lb)); r1.setAttribute('x2', XB(lb)); r2.setAttribute('x1', XB(lr)); r2.setAttribute('x2', XB(lr));
  document.getElementById('vv').textContent = beta.toFixed(2) + ' c' + (Math.abs(beta - 0.33) < 0.015 ? '（≈ c/3）' : '');
  document.getElementById('hw').textContent = '± ' + Math.round(hw) + ' nm';
  document.getElementById('re').textContent = Math.round(lb) + ' – ' + Math.round(lr) + ' nm';
}
tI.addEventListener('input', upd); vI.addEventListener('input', upd); upd();
</script></body></html>
